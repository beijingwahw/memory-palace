# DSH YAML configuration example for Memory Palace

plugins:
  - "@dsh-plugins/memory-palace"

memoryPalace:
  # Where the SQLite database lives. ${workspace} resolves to the
  # active DSH workspace directory at install time.
  storagePath: "${workspace}/.dsh/memory-palace.db"

  embedding:
    # Use the real DeepSeek Embedding API for high-quality vectors.
    # - No apiKey set            → offline-bm25 is used from the start.
    # - API unreachable at runs  → a circuit breaker opens and embeddings
    #                              are served by offline-bm25 until the API
    #                              recovers (vectors are space-tagged, so
    #                              the two never get compared).
    provider: deepseek
    model: deepseek-embed
    dimensions: 1024
    apiKey: ${DEEPSEEK_API_KEY}
    baseUrl: https://api.deepseek.com

  retrieval:
    topK: 8              # items returned per query
    mmrLambda: 0.5       # 0 = pure diversity, 1 = pure relevance
    minScore: 0.1        # floor on RAW cosine (pre-decay); ~0.3 for dense providers
    rerank: true         # add keyword rerank on top of vector recall
    graphBoost: 0.15     # zero-mean PageRank prior (0 disables)
    prf:                # pseudo-relevance feedback (Rocchio 2nd pass)
      enabled: true
      alpha: 0.7        # weight of the original query vector
      beta: 0.3         # weight of the top-hit centroid
      depth: 3          # top hits forming the centroid
    entityHop: true     # recall items linked to top-hit entities
    queryCache: true    # near-duplicate queries skip the pipeline
    ivf:                # deterministic IVF bucket index — pure accelerator:
      enabled: true     # probe radius escalates until the candidate pool is
      radius: 1         # satisfied, ending in all-keys = the exact scan, so
      minItems: 2000    # recall never depends on the index. Engages only
                        # above this many items per space (below it the
                        # exact scan is already fast).
    quantization: int8  # vector storage precision: int8 = 4× denser with
                        # bounded (measured) cosine error; float32 = exact
    fusionLearning:     # online fusion learning: engagement feedback moves
      enabled: true     # the vector/keyword blend (and PRF/graph weights)
      lr: 0.02          # inside fixed ±20% safety rails; audit via
                        # memory_bandit; reflection stays the offline bound
    # Write-time intelligence (memory_remember) similarity thresholds —
    # defaults shown, commented; unset values are byte-identical:
    #   writeDedupeThreshold: 0.92   # near-duplicate merge line — sparse
    #                              # (offline-bm25) embeddings over-score
    #                              # templated numeric content; lower it for
    #                              # such corpora (the response's writeOutcome
    #                              #   + advisory makes every merge visible)
    #   conflictScanThreshold: 0.75  # conflict-scan floor — high similarity
    #                              # + contradiction routes the write to the
    #                              # supersede/conflict path, never a silent
    #                              # merge (pinned as invariant I-RC-14)

  compression:
    enabled: true
    triggerCount: 200    # run when total item count crosses this
    importanceThreshold: 0.35  # evict below this importance
    decayHalfLifeDays: 14       # older items lose score exponentially

  graph:
    enabled: true
    maxEntities: 5000
    pagerankDamping: 0.85
    pagerankIterations: 20         # power-iteration rounds for the rank kernel
    pagerankEdgeDecayDays: 30      # half-life (days) for edge recency; 0 disables
    personalizationWeight: 0.6     # PPR-vs-global blend when query entities are known

  injection:
    enabled: true
    maxTokens: 2000
    warmRanks: true      # pre-warm personalized PageRank at session start
    systemPromptPrefix: |
      You have access to a long-term memory palace. When the user references
      past context, consult it via the memory_retrieve tool before answering.

  # scope sets the home visibility tier for NEW memories. Every scoppable
  # row — memory items, graph entities, graph edges — carries one of four
  # visibility tiers:
  #   session   → only the owning session
  #   workspace → only the owning workspace
  #   user      → only the owning user (plus global)
  #   global    → everyone (shared knowledge base)
  # Retrieval widens cumulatively (session → workspace → user → global) only
  # while the candidate pool is thin, and never crosses an owner boundary.
  # memory_remember accepts a per-item visibility override ("remember this
  # globally"); anonymous callers see the global tier only.
  #
  # scope never widens into OTHER users' memories:
  #   user      → own + global memories, across all sessions
  #   workspace → this workspace, widening to own + global when thin
  #   session   → this session, widening to workspace, then own + global
  scope: user
  #
  # anonymousPolicy — treatment of writes from callers carrying NO identity
  # at all (no user / workspace / session id). Unset = "global". Three states:
  #   global      anonymous writes land the shared global tier — the
  #               zero-config default, byte-identical to previous behavior
  #   quarantine  anonymous writes land the "__anonymous__" session bucket,
  #               invisible to identified users — recommended default for
  #               multi-tenant hosts
  #   reject      anonymous writes are refused outright (fail-closed; for
  #               hosts that guarantee identity at their own boundary)
  #
  # adminUserIds — admin allowlist for GLOBAL SIDE EFFECTS (today: live
  # memory_migrate runs). Unset = single-user trust model (confirm-only,
  # zero-config compatible). Once set, a live run requires BOTH the
  # caller's userId being on the list AND confirm:true (double gate);
  # anonymous callers and non-members are refused fail-closed.
  # Recommended for multi-tenant hosts (pair it with anonymousPolicy
  # above). The MCP server reads the same list from the
  # MEMORY_PALACE_ADMIN_IDS environment variable (empty arrays and
  # empty-string entries fail loud).
  # Fully-expanded form (defaults commented out):
  # scope:
  #   kind: user
  #   anonymousPolicy: quarantine
  #   adminUserIds:
  #     - "user-alice"       # members may run live migrations (with
  #     - "ops-bot-01"       # confirm:true); everyone else is refused
